name: ai-gateway-wn

services:
  postgres:
    image: postgres:16-alpine
    container_name: wn_postgres
    restart: unless-stopped
    command: ["postgres", "-c", "search_path=ai_gateway"]
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - wn_postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:latest
    container_name: wn_valkey
    restart: unless-stopped
    ports:
      - "${VALKEY_HOST_PORT:-6390}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: wn_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Deliberately no KC_HOSTNAME override: this build's default hostname:v2
      # provider ties ALL Keycloak-generated URLs (browser login/redirect pages,
      # backchannel token issuer) to a single hostname, so pinning it to the
      # Docker-internal "keycloak:8080" (to satisfy the backend's issuer check)
      # breaks the browser's login flow outright ("this site can't be reached",
      # since a browser cannot resolve the "keycloak" service name). Instead,
      # Keycloak issues tokens using whatever host the request came in on --
      # localhost:8180 for the browser -- and gateway-backend's KEYCLOAK_BASE_URL
      # below is set to match that, with KEYCLOAK_JWKS_URL separately overridden
      # for the network call the container itself needs to make. See
      # docs/identity-provider-architecture.md and the gateway-backend block below.
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "${KEYCLOAK_HOST_PORT:-8180}:8080"

  guardrails-mock:
    build: ./mock-guardrails
    container_name: wn_guardrails_mock
    restart: unless-stopped
    ports:
      - "${GUARDRAILS_HOST_PORT:-9100}:9000"

  infisical:
    image: infisical/infisical:latest
    container_name: wn_infisical
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      SITE_URL: http://localhost:${INFISICAL_HOST_PORT:-8081}
      NODE_ENV: production
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-change-me}
      AUTH_SECRET: ${AUTH_SECRET:-dev-auth-secret-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      REDIS_URL: redis://valkey:6379/0
      DB_CONNECTION_URI: postgresql+asyncpg://gateway:gateway@postgres:5432/gateway
    ports:
      - "${INFISICAL_HOST_PORT:-8081}:8080"

  gateway-backend-postgres-data:
    build: ./backend
    container_name: wn_gateway_backend_postgres_data
    restart: unless-stopped
    command: sh -c "alembic upgrade head"
    # volumes:
    #   - wn_postgres_data:/var/lib/postgresql/data
    #   - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@postgres:5432/gateway
      database_schema: ${database_schema:-ai_gateway}
    depends_on:
      postgres:
        condition: service_healthy

  gateway-backend:
    build: ./backend
    container_name: wn_gateway_backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level ${LOG_LEVEL:-debug}"
    # command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --log-level ${LOG_LEVEL:-debug}"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@postgres:5432/gateway
      database_schema: ${database_schema:-ai_gateway}
      VALKEY_HOST: ${VALKEY_HOST:-valkey}
      VALKEY_PORT: ${VALKEY_PORT:-6379}
      VALKEY_DB: ${VALKEY_DB:-0}
      VALKEY_USER: ${VALKEY_USER:-}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379/0}
      # Must match the host the BROWSER uses to reach Keycloak (localhost:8180,
      # not the Docker-internal "keycloak:8080") -- this is what every token's
      # `iss` claim actually contains, since Keycloak stamps the issuer from the
      # request that obtained the token, and that's always the browser's request.
      # KEYCLOAK_JWKS_URL below overrides the network-reachable path separately,
      # since "localhost:8180" from inside this very container refers to itself,
      # not the keycloak container.
      KEYCLOAK_BASE_URL: http://localhost:${KEYCLOAK_HOST_PORT:-8180}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/gateway/protocol/openid-connect/certs
      KEYCLOAK_REALM: gateway
      KEYCLOAK_CLIENT_ID: gateway-frontend
      KEYCLOAK_AUDIENCE: gateway-backend
      GUARDRAILS_BASE_URL: http://guardrails-mock:9000
      API_KEY_SECRET_PEPPER: ${API_KEY_SECRET_PEPPER:-dev-pepper-change-me}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-us-east-1}
      # Identity Provider layer (app/identity/) -- Keycloak (above) is the
      # default and remains fully configured for local dev out of the box;
      # switch IDENTITY_PROVIDER + the matching block below to run against an
      # enterprise IdP instead. See docs/identity-provider-architecture.md.
      IDENTITY_PROVIDER: ${IDENTITY_PROVIDER:-keycloak}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      OKTA_DOMAIN: ${OKTA_DOMAIN:-}
      OKTA_CLIENT_ID: ${OKTA_CLIENT_ID:-}
      AWS_SSO_REGION: ${AWS_SSO_REGION:-}
      AWS_SSO_INSTANCE_ARN: ${AWS_SSO_INSTANCE_ARN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_WORKSPACE_DOMAIN: ${GOOGLE_WORKSPACE_DOMAIN:-}
      # Secret Provider layer (app/secrets/) -- provider credentials themselves
      # (OPENAI_API_KEY, ANTHROPIC_API_KEY, ...) are never set here; they live in
      # whichever backend SECRET_PROVIDER points at. See docs/secret-management.md.
      # Default "postgres" stores them (Fernet-encrypted) in this same Postgres
      # instance -- zero extra services for local dev. Change the encryption key
      # for anything beyond local dev; this default is a placeholder, not a secret
      # worth keeping past first run.
      SECRET_PROVIDER: ${SECRET_PROVIDER:-postgres}
      SECRET_STORAGE_ENCRYPTION_KEY: ${SECRET_STORAGE_ENCRYPTION_KEY:-ZkcyJKfplZZRbdiUXnsC15rHoufpJvBoThi14IV8tiQ=}
      
      # Leave unset to avoid selecting any backend by default.
      # SECRET_PROVIDER: ${SECRET_PROVIDER:-None}
      INFISICAL_SITE_URL: ${INFISICAL_SITE_URL:-http://infisical:8080}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-dev}
      AWS_SECRETS_REGION: ${AWS_SECRETS_REGION:-}
      AWS_SECRET_NAME_PREFIX: ${AWS_SECRET_NAME_PREFIX:-llm-gateway}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      AZURE_KEYVAULT_NAME: ${AZURE_KEYVAULT_NAME:-}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
    ports:
      - "${BACKEND_HOST_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      keycloak:
        condition: service_started
      guardrails-mock:
        condition: service_started
      infisical:
        condition: service_started

  gateway-frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:${BACKEND_HOST_PORT:-8010}
        VITE_KEYCLOAK_URL: http://localhost:${KEYCLOAK_HOST_PORT:-8180}
        VITE_KEYCLOAK_REALM: gateway
        VITE_KEYCLOAK_CLIENT_ID: gateway-frontend
    container_name: wn_gateway_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      - gateway-backend

volumes:
  wn_postgres_data:
